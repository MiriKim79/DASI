# nginx site 설정 — 프론트(빌드된 정적 파일)를 서빙하고, /api와 /media는 백엔드(8000)로 proxy.
#
# /media는 콘텐츠 사진·음성 정적 파일 경로(backend/app/main.py가 /media/{folder}로 mount).
# DB의 image_url이 "/media/dramaQ/xxx.jpg" 같은 상대경로로 저장되고 프론트가 base URL 없이
# <img src={image_url}>로 그대로 쓰기 때문에, 프론트와 백엔드가 같은 도메인(이 nginx)을
# 통해서만 나가야 사진이 뜬다 — /api와 마찬가지로 /media도 반드시 프록시해야 함.
#
# 설치:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/dasi
#   sudo ln -s /etc/nginx/sites-available/dasi /etc/nginx/sites-enabled/dasi
#   sudo rm -f /etc/nginx/sites-enabled/default   # 기본 페이지와 충돌 방지
#   sudo nginx -t && sudo systemctl reload nginx
#
# server_name과 root 경로는 실제 서버 상황(도메인 유무, 배포 경로)에 맞게 수정할 것.
# 도메인이 없으면 server_name을 EC2 퍼블릭 IP 또는 _ (아무 호스트나 매칭)로 둬도 된다.

server {
    listen 80;
    server_name _;

    root /home/ubuntu/DASI/frontend/dist;
    index index.html;

    # React Router의 클라이언트 사이드 라우팅 — 존재하지 않는 경로는 index.html로 폴백
    location / {
        try_files $uri /index.html;
    }

    # 백엔드 API — FastAPI(uvicorn, 8000번 포트)로 프록시
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 콘텐츠 사진·음성 정적 파일 — 백엔드가 /media/{folder}로 서빙하는 것을 그대로 프록시
    location /media/ {
        proxy_pass http://127.0.0.1:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
