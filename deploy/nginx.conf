# nginx site 설정 — 프론트(빌드된 정적 파일)를 서빙하고, /api는 백엔드(8000)로 proxy.
#
# 설치:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/dasi
#   sudo ln -s /etc/nginx/sites-available/dasi /etc/nginx/sites-enabled/dasi
#   sudo rm -f /etc/nginx/sites-enabled/default   # 기본 페이지와 충돌 방지
#   sudo nginx -t && sudo systemctl reload nginx
#
# server_name과 root 경로는 실제 서버 상황(도메인 유무, 배포 경로)에 맞게 수정할 것.
# 도메인이 없으면 server_name을 EC2 퍼블릭 IP 또는 _ (아무 호스트나 매칭)로 둬도 된다.

server {
    listen 80;
    server_name _;

    root /home/ubuntu/DASI/frontend/dist;
    index index.html;

    # React Router의 클라이언트 사이드 라우팅 — 존재하지 않는 경로는 index.html로 폴백
    location / {
        try_files $uri /index.html;
    }

    # 백엔드 API — FastAPI(uvicorn, 8000번 포트)로 프록시
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
